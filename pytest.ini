[pytest]
# Pytest configuration for toolkit

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (fail if unknown marker used)
    --strict-markers
    # Strict config (fail on config errors)
    --strict-config
    # Coverage options
    --cov=src/toolkit
    --cov-report=html:htmlcov
    --cov-report=term-missing:skip-covered
    --cov-report=xml
    # Fail if coverage below 90%
    --cov-fail-under=90
    # Async support
    --asyncio-mode=auto
    # Warnings
    -W error::DeprecationWarning
    -W error::PendingDeprecationWarning

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, test module interactions)
    performance: Performance benchmark tests
    benchmark: Benchmark tests with pytest-benchmark
    property: Property-based tests with hypothesis
    slow: Slow tests (> 1 second)
    requires_redis: Tests that require Redis
    requires_memcached: Tests that require Memcached

# Coverage options
[coverage:run]
source = src/toolkit
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */virtualenv/*
    */.venv/*

[coverage:report]
precision = 2
exclude_lines =
    # Standard pragma
    pragma: no cover
    # Don't complain about missing debug-only code
    def __repr__
    def __str__
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
    @abstractmethod
    # Don't complain about protocol definitions
    \.\.\.

[coverage:html]
directory = htmlcov
