version: '3.8'

services:
  probabilistic-structures:
    build:
      context: ../..
      dockerfile: examples/19_probabilistic_structures/Dockerfile
    container_name: probabilistic-structures
    ports:
      - "8019:8019"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8019/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
