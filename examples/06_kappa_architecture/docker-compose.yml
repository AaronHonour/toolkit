version: '3.8'

services:
  kappa-architecture:
    build:
      context: ../..
      dockerfile: examples/06_kappa_architecture/Dockerfile
    container_name: kappa-architecture
    ports:
      - "8006:8006"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
