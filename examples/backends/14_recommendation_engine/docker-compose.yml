version: '3.8'

services:
  recommendation-engine:
    build:
      context: ../..
      dockerfile: examples/14_recommendation_engine/Dockerfile
    container_name: recommendation-engine
    ports:
      - "8014:8014"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8014/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
