version: '3.8'

services:
  rate-limiter:
    build:
      context: ../..
      dockerfile: examples/11_rate_limiter/Dockerfile
    container_name: rate-limiter
    ports:
      - "8011:8011"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
