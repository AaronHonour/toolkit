      dockerfile: Dockerfile
      target: development
    container_name: unistax-app01
    working_dir: /app/backends/01_high_performance_rest_api
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://unistax:unistax_dev@postgres:5432/unistax
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backends/01_high_performance_rest_api:/app/backends/01_high_performance_rest_api
      - ../python/src:/app/src
    networks:
