version: '3.8'

services:
  fulltext-search:
    build:
      context: ../..
      dockerfile: examples/15_fulltext_search/Dockerfile
    container_name: fulltext-search
    ports:
      - "8015:8015"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8015/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
