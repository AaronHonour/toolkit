version: '3.8'

services:
  distributed-cache:
    build:
      context: ../..
      dockerfile: examples/09_distributed_cache/Dockerfile
    container_name: distributed-cache
    ports:
      - "8009:8009"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
