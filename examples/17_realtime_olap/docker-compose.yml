version: '3.8'

services:
  realtime-olap:
    build:
      context: ../..
      dockerfile: examples/17_realtime_olap/Dockerfile
    container_name: realtime-olap
    ports:
      - "8017:8017"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8017/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
