version: '3.8'

services:
  message-queue:
    build:
      context: ../..
      dockerfile: examples/10_message_queue/Dockerfile
    container_name: message-queue
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
