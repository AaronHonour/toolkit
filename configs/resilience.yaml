# Resilience Configuration

resilience:
  # Circuit breaker settings
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    timeout: 60.0
    half_open_max_calls: 3

  # Fallback strategies
  fallback:
    enabled: true
    strategies:
      external_api:
        type: cached_response
        ttl: 300

      database:
        type: default_value
        value: {}

  # Bulkhead pattern
  bulkhead:
    enabled: false
    max_concurrent: 100
    max_queue: 1000

  # Timeout settings
  timeouts:
    database: 5.0
    cache: 1.0
    external_api: 10.0

  # Retry policy
  retry:
    max_attempts: 3
    backoff:
      type: exponential
      base: 1.0
      max: 60.0
