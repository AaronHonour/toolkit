# Rate Limiting Configuration

ratelimit:
  # Backend: memory, redis
  backend: memory

  # Default rate limit
  default_limit: 1000  # requests
  default_period: 3600  # seconds (1 hour)

  # Algorithm: token_bucket, sliding_window, fixed_window
  algorithm: token_bucket

  # Per-endpoint limits
  limits:
    "/api/search":
      limit: 100
      period: 60  # per minute

    "/api/upload":
      limit: 10
      period: 60

    "/api/login":
      limit: 5
      period: 300  # 5 minutes

  # Per-user limits
  user_limits:
    default:
      limit: 1000
      period: 3600

    premium:
      limit: 10000
      period: 3600

  # Redis configuration (if backend=redis)
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    db: 1

  # Response headers
  headers:
    include_remaining: true
    include_reset_time: true
