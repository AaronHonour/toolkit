# Application Configuration Example
# Demonstrates configuration management with environment variable interpolation

app:
  name: backend-toolkit-app
  version: 1.0.0
  debug: ${DEBUG:-false}

database:
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:5432}
  name: ${DB_NAME:appdb}
  username: ${DB_USER:postgres}
  password: ${DB_PASSWORD}
  pool:
    min_size: 2
    max_size: 10
    timeout: 30

cache:
  backend: redis
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  ttl: 3600
  key_prefix: ${APP_NAME:app}

api:
  host: ${API_HOST:0.0.0.0}
  port: ${API_PORT:8000}
  workers: ${API_WORKERS:4}
  timeout: 60
  cors:
    enabled: true
    origins:
      - http://localhost:3000
      - https://app.example.com
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    headers:
      - Content-Type
      - Authorization

features:
  rate_limiting: true
  authentication: true
  metrics: true
  tracing: ${ENABLE_TRACING:false}

security:
  secret_key: ${SECRET_KEY}
  jwt_algorithm: HS256
  jwt_expiration: 3600
  password_min_length: 8
  max_login_attempts: 5

services:
  email:
    provider: smtp
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    from_address: ${EMAIL_FROM:noreply@example.com}

  storage:
    provider: ${STORAGE_PROVIDER:local}
    bucket: ${STORAGE_BUCKET:uploads}
    region: ${STORAGE_REGION:us-east-1}
    access_key: ${STORAGE_ACCESS_KEY}
    secret_key: ${STORAGE_SECRET_KEY}
