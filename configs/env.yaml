# Environment Configuration Example
# Demonstrates environment variable management

env_file: .env
environment: ${ENV:development}

# Required environment variables
required:
  - SECRET_KEY
  - DATABASE_URL
  - REDIS_URL

# Environment-specific settings
development:
  debug: true
  log_level: DEBUG
  database:
    pool_size: 5
  cache:
    ttl: 300

testing:
  debug: true
  log_level: DEBUG
  database:
    pool_size: 2
  cache:
    ttl: 60

staging:
  debug: false
  log_level: INFO
  database:
    pool_size: 10
  cache:
    ttl: 3600

production:
  debug: false
  log_level: WARNING
  database:
    pool_size: 20
  cache:
    ttl: 3600

  # Production-specific features
  features:
    rate_limiting: true
    monitoring: true
    tracing: true

  # Production security
  security:
    ssl_required: true
    cors_strict: true
    csrf_protection: true
