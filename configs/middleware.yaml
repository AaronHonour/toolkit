# Middleware Pipeline Configuration

middleware:
  # Enable middleware
  enabled: true

  # Middleware chain (order matters!)
  chain:
    - type: error_handler
      enabled: true

    - type: logging
      enabled: true
      log_requests: true
      log_responses: true
      log_headers: ${LOG_HEADERS:false}

    - type: metrics
      enabled: true
      track_duration: true
      track_status_codes: true

    - type: cors
      enabled: ${CORS_ENABLED:true}
      allow_origins:
        - http://localhost:3000
        - https://app.example.com
      allow_methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allow_headers:
        - "*"
      max_age: 3600

    - type: compression
      enabled: true
      min_size: 1024
      algorithms:
        - gzip

    - type: auth
      enabled: true
      exclude_paths:
        - /health
        - /metrics
        - /docs
