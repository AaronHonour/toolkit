openapi: 3.0.3
info:
  title: Full-Text Search API
  description: |
    Elasticsearch-powered full-text search with autocomplete, faceted navigation,
    and relevance scoring.

    **Features:**
    - Full-text search across multiple fields
    - Autocomplete suggestions (< 20ms)
    - Faceted navigation
    - Relevance tuning and boosting
    - Fuzzy matching
    - Real-time indexing
  version: 1.0.0
  contact:
    name: API Support
    email: api@toolkit.example.com

servers:
  - url: http://localhost:8015
    description: Local development server
  - url: https://api.toolkit.example.com/search
    description: Production server

tags:
  - name: Search
    description: Search operations
  - name: Autocomplete
    description: Autocomplete suggestions
  - name: Indexing
    description: Document indexing
  - name: Health
    description: Service health checks

paths:
  /search:
    post:
      tags:
        - Search
      summary: Search documents
      description: Full-text search with filters and facets
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              search:
                value:
                  query: "laptop"
                  filters:
                    categories: ["electronics"]
                    price_range:
                      min: 500
                      max: 2000
                  page: 1
                  page_size: 20
                  sort: "_score"
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /autocomplete:
    get:
      tags:
        - Autocomplete
      summary: Get autocomplete suggestions
      operationId: autocomplete
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 20
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                        score:
                          type: number
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /index/document:
    post:
      tags:
        - Indexing
      summary: Index document
      description: Index a document for search
      operationId: indexDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - title
              properties:
                id:
                  type: string
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                price:
                  type: number
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Document indexed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
        filters:
          type: object
          additionalProperties: true
        page:
          type: integer
          default: 1
          minimum: 1
        page_size:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        sort:
          type: string
          default: "_score"

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        total:
          type: integer
        page:
          type: integer
        facets:
          type: object
          additionalProperties:
            type: array

    SearchResult:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: number
        score:
          type: number

    HealthStatus:
      type: object
      properties:
        status:
          type: string
        elasticsearch:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security:
  - bearerAuth: []
