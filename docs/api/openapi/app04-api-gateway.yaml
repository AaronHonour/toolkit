openapi: 3.0.3
info:
  title: API Gateway
  description: |
    Centralized API Gateway with authentication, rate limiting, request routing,
    and service orchestration.

    **Features:**
    - JWT authentication and authorization
    - Rate limiting per user/IP
    - Request routing to backend services
    - Response caching
    - Request/response transformation
    - API key management
    - Quota management
  version: 1.0.0
  contact:
    name: API Support
    email: api@toolkit.example.com

servers:
  - url: http://localhost:8004
    description: Local development server
  - url: https://api.toolkit.example.com
    description: Production server

tags:
  - name: Authentication
    description: Authentication and authorization
  - name: API Keys
    description: API key management
  - name: Rate Limits
    description: Rate limit configuration
  - name: Routes
    description: Route management
  - name: Health
    description: Service health checks

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and receive JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
            examples:
              user:
                value:
                  username: "demo@example.com"
                  password: "securePassword123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  value:
                    access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    token_type: "Bearer"
                    expires_in: 3600
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh token
      description: Get new access token using refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/validate:
    post:
      tags:
        - Authentication
      summary: Validate token
      description: Validate JWT token and return user info
      operationId: validateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  user_id:
                    type: string
                  scopes:
                    type: array
                    items:
                      type: string
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api-keys:
    get:
      tags:
        - API Keys
      summary: List API keys
      description: List all API keys for the authenticated user
      operationId: listApiKeys
      responses:
        '200':
          description: API keys retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

    post:
      tags:
        - API Keys
      summary: Create API key
      description: Generate a new API key
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: API key name
                scopes:
                  type: array
                  items:
                    type: string
                  description: Permission scopes
                rate_limit:
                  type: integer
                  description: Requests per hour
                  default: 1000
            examples:
              newKey:
                value:
                  name: "Production App Key"
                  scopes: ["read:products", "write:orders"]
                  rate_limit: 5000
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
              examples:
                created:
                  value:
                    id: "key_abc123"
                    name: "Production App Key"
                    key: "sk_live_abc123def456..."
                    scopes: ["read:products", "write:orders"]
                    rate_limit: 5000
                    created_at: "2024-01-22T15:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /api-keys/{key_id}:
    delete:
      tags:
        - API Keys
      summary: Revoke API key
      description: Revoke an API key
      operationId: revokeApiKey
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: API key revoked
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /rate-limits:
    get:
      tags:
        - Rate Limits
      summary: Get rate limit config
      description: Get current rate limit configuration
      operationId: getRateLimits
      responses:
        '200':
          description: Rate limit configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiers:
                    type: array
                    items:
                      type: object
                      properties:
                        tier:
                          type: string
                        rate:
                          type: integer
                        period:
                          type: integer
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /rate-limits/status:
    get:
      tags:
        - Rate Limits
      summary: Get rate limit status
      description: Get current rate limit usage for authenticated user
      operationId: getRateLimitStatus
      responses:
        '200':
          description: Rate limit status
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  limit:
                    type: integer
                  remaining:
                    type: integer
                  reset_at:
                    type: string
                    format: date-time
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /routes:
    get:
      tags:
        - Routes
      summary: List routes
      description: List all configured routes
      operationId: listRoutes
      responses:
        '200':
          description: Routes retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  routes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Route'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /cache/clear:
    post:
      tags:
        - Routes
      summary: Clear cache
      description: Clear response cache
      operationId: clearCache
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pattern:
                  type: string
                  description: Cache key pattern to clear
      responses:
        '200':
          description: Cache cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleared:
                    type: integer
                    description: Number of cache entries cleared
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the API gateway is running
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key

  headers:
    X-RateLimit-Limit:
      description: Request limit per hour
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Remaining requests
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Time when rate limit resets (Unix timestamp)
      schema:
        type: integer

  schemas:
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: JWT refresh token
        token_type:
          type: string
          default: "Bearer"
        expires_in:
          type: integer
          description: Token expiration time in seconds

    ApiKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
          description: First 8 characters of the key
        scopes:
          type: array
          items:
            type: string
        rate_limit:
          type: integer
        created_at:
          type: string
          format: date-time
        last_used:
          type: string
          format: date-time

    ApiKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          properties:
            key:
              type: string
              description: Full API key (shown only once)

    Route:
      type: object
      properties:
        path:
          type: string
        method:
          type: string
        target:
          type: string
          description: Backend service URL
        cache_ttl:
          type: integer
          description: Cache TTL in seconds
        rate_limit:
          type: integer
        auth_required:
          type: boolean

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          description: Backend service health status

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
