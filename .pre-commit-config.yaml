# Pre-commit hooks for Unistax
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Python formatting and linting
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        name: Format Python with Black
        args: [--line-length=100]
        files: ^(python/|examples/backends/|tests/).*\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        name: Lint Python with Ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(python/|examples/backends/|tests/).*\.py$
      - id: ruff-format
        name: Format Python with Ruff
        files: ^(python/|examples/backends/|tests/).*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: Type check Python with mypy
        files: ^python/src/.*\.py$
        args: [--config-file=python/pyproject.toml]
        additional_dependencies:
          - types-PyYAML
          - types-requests
          - pydantic

  # JavaScript/TypeScript formatting and linting
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.16.0
    hooks:
      - id: eslint
        name: Lint JS/TS with ESLint
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        types: [file]
        args: [--fix, --max-warnings=0]
        additional_dependencies:
          - eslint@^8.57.0
          - '@typescript-eslint/eslint-plugin@^6.21.0'
          - '@typescript-eslint/parser@^6.21.0'

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Format with Prettier
        files: ^frontend/.*\.(js|jsx|ts|tsx|json|css|scss|md)$
        args: [--write]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        exclude: ^frontend/node_modules/
      - id: end-of-file-fixer
        name: Fix end of files
        exclude: ^frontend/node_modules/
      - id: check-yaml
        name: Check YAML syntax
        exclude: ^frontend/node_modules/
      - id: check-json
        name: Check JSON syntax
        exclude: ^frontend/node_modules/
      - id: check-toml
        name: Check TOML syntax
      - id: check-added-large-files
        name: Check for large files
        args: [--maxkb=1000]
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: [--fix=lf]
        exclude: ^frontend/node_modules/

  # Docker file linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles
        files: Dockerfile.*

  # Security checks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^frontend/node_modules/

# Configuration
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false
