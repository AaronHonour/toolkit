name: Nightly Build

on:
  schedule:
    - cron: "0 2 * * *"  # Run at 2 AM UTC daily
  workflow_dispatch:  # Allow manual trigger

jobs:
  # ============================================================================
  # Full Test Suite (Including Slow Tests)
  # ============================================================================
  full-test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Run all tests (including slow)
        run: |
          pytest tests/ \
            --cov=src/toolkit \
            --cov-report=xml \
            --cov-report=html \
            -n auto \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: nightly
          fail_ci_if_error: false

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ============================================================================
  # Property-Based Tests (Hypothesis)
  # ============================================================================
  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run property tests
        run: |
          pytest tests/ \
            -m "property" \
            --hypothesis-profile=ci \
            -v
        env:
          HYPOTHESIS_PROFILE: ci

  # ============================================================================
  # Performance Regression Tests
  # ============================================================================
  performance-regression:
    name: Performance Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run performance benchmarks
        run: |
          pytest tests/performance/ \
            --benchmark-only \
            --benchmark-json=benchmark.json \
            --benchmark-compare=main \
            --benchmark-compare-fail=mean:10% \
            -v

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "pytest"
          output-file-path: benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "110%"  # Alert if performance degrades by 10%
          comment-on-alert: true
          fail-on-alert: true

  # ============================================================================
  # Memory Profiling
  # ============================================================================
  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run memory profiling
        run: |
          python -m memory_profiler tests/benchmark.py > memory-profile.txt

      - name: Upload memory profile
        uses: actions/upload-artifact@v4
        with:
          name: memory-profile
          path: memory-profile.txt

  # ============================================================================
  # Dependency Security Audit
  # ============================================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --desc --format json > pip-audit.json
        continue-on-error: true

      - name: Run Safety check
        run: safety check --json > safety.json
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: |
            pip-audit.json
            safety.json

  # ============================================================================
  # Load Testing
  # ============================================================================
  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Locust tests
        run: |
          # Start background services if needed
          # Run load tests
          locust -f tests/load/locustfile.py \
            --headless \
            --users 100 \
            --spawn-rate 10 \
            --run-time 5m \
            --html locust-report.html
        continue-on-error: true

      - name: Upload load test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-report
          path: locust-report.html

  # ============================================================================
  # Nightly Build Summary
  # ============================================================================
  nightly-summary:
    name: Nightly Build Summary
    runs-on: ubuntu-latest
    needs:
      - full-test-suite
      - property-tests
      - performance-regression
      - memory-profiling
      - security-audit
    if: always()

    steps:
      - name: Send notification
        run: |
          echo "Nightly build completed"
          echo "Full Tests: ${{ needs.full-test-suite.result }}"
          echo "Property Tests: ${{ needs.property-tests.result }}"
          echo "Performance: ${{ needs.performance-regression.result }}"
          echo "Memory: ${{ needs.memory-profiling.result }}"
          echo "Security: ${{ needs.security-audit.result }}"

      # Add Slack/Discord notification here if needed
