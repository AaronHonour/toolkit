[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-toolkit"
version = "0.3.0"
description = "Complete enterprise-grade Python toolkit for backend development with DI, lifecycle, middleware, events, repository, security, CLI, and testing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["backend", "toolkit", "logging", "configuration", "errors"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "types-PyYAML",
    "types-requests",
]

# HTTP client support
http = [
    "requests>=2.28.0",
]

# Cache backends
cache = [
    "redis>=4.5.0",
    "pymemcache>=4.0.0",
]

# Metrics backends
metrics = [
    "prometheus-client>=0.16.0",
    "statsd>=4.0.0",
]

# Database support
database = [
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",  # PostgreSQL
    "pymysql>=1.0.0",  # MySQL
]

# Task queue support
tasks = [
    "celery>=5.2.0",
    "redis>=4.5.0",
]

# Tracing support
tracing = [
    "opentelemetry-api>=1.15.0",
    "opentelemetry-sdk>=1.15.0",
    "opentelemetry-instrumentation>=0.36b0",
]

# All optional dependencies
all = [
    "requests>=2.28.0",
    "redis>=4.5.0",
    "pymemcache>=4.0.0",
    "prometheus-client>=0.16.0",
    "statsd>=4.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.0.0",
    "celery>=5.2.0",
    "opentelemetry-api>=1.15.0",
    "opentelemetry-sdk>=1.15.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/backend-toolkit"
Documentation = "https://github.com/yourusername/backend-toolkit#readme"
Repository = "https://github.com/yourusername/backend-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/toolkit --cov-report=term-missing"
