  # App 16: Feature Store
  app16-featurestore:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: toolkit-app16
    working_dir: /app/examples/16_feature_store
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8016 --reload
    ports:
      - "8016:8016"
    environment:
      DATABASE_URL: postgresql://toolkit:toolkit_dev@postgres:5432/toolkit
