  # App 11: Rate Limiter Dashboard
  app11-ratelimiter:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: toolkit-app11
    working_dir: /app/examples/11_rate_limiter
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8011 --reload
