version: '3.8'

# =============================================================================
# Composable Toolkit - Full Stack Docker Compose
# All 19 backend services + frontend + infrastructure
# =============================================================================

networks:
  toolkit-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  timescale-data:
  prometheus-data:
  grafana-data:

services:
  # ===========================================================================
  # Infrastructure Services
  # ===========================================================================

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: toolkit-postgres
    environment:
      POSTGRES_USER: toolkit
      POSTGRES_PASSWORD: toolkit_dev
      POSTGRES_DB: toolkit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - toolkit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolkit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: toolkit-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - toolkit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: toolkit-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - toolkit-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: toolkit-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - toolkit-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # TimescaleDB (for time-series data)
  timescale:
    image: timescale/timescaledb:latest-pg15
    container_name: toolkit-timescale
    environment:
      POSTGRES_USER: toolkit
      POSTGRES_PASSWORD: toolkit_dev
      POSTGRES_DB: toolkit
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    networks:
      - toolkit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolkit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Backend Services (01-19)
  # ===========================================================================

  # App 01: E-Commerce Inventory
  app01-inventory:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: toolkit-app01
    working_dir: /app/examples/01_high_performance_rest_api
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://toolkit:toolkit_dev@postgres:5432/toolkit
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app:/app/examples/01_high_performance_rest_api
    depends_on:
      - postgres
      - redis
    volumes:
      - ./src:/app/src
      - ./examples:/app/examples
    networks:
      - toolkit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # App 02: Real-Time Analytics
  app02-analytics:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: toolkit-app02
    working_dir: /app/examples/02_realtime_analytics_dashboard
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"
    environment:
      KAFKA_BROKERS: kafka:9092
      PYTHONPATH: /app:/app/examples/02_realtime_analytics_dashboard
    depends_on:
      - kafka
      - redis
      - timescale
    volumes:
      - ./src:/app/src
      - ./examples:/app/examples
    networks:
      - toolkit-network

  # App 03: File Processing
  app03-file-processor:
