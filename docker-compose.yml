    container_name: toolkit-app18
    working_dir: /app/examples/18_distributed_tracing
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8018 --reload
    ports:
      - "8018:8018"
    environment:
      REDIS_URL: redis://redis:6379/9
      PYTHONPATH: /app:/app/examples/18_distributed_tracing
    depends_on:
      - redis
    volumes:
      - ./src:/app/src
      - ./examples:/app/examples
    networks:
      - toolkit-network

  # App 19: Probabilistic Structures
  app19-probabilistic:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: toolkit-app19
    working_dir: /app/examples/19_probabilistic_structures
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8019 --reload
    ports:
      - "8019:8019"
    environment:
      REDIS_URL: redis://redis:6379/10
      PYTHONPATH: /app:/app/examples/19_probabilistic_structures
    depends_on:
      - redis
    volumes:
      - ./src:/app/src
      - ./examples:/app/examples
    networks:
      - toolkit-network

  # ===========================================================================
  # Frontend Services
  # ===========================================================================

  # Frontend - Development
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: toolkit-frontend
    ports:
      - "3000-3019:3000-3019"
    environment:
      VITE_API_BASE_URL: http://localhost:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - toolkit-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Documentation Site
  # ===========================================================================

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
      target: development
    container_name: toolkit-docs
    ports:
      - "5173:5173"
    volumes:
      - ./docs:/app
      - /app/node_modules
    networks:
      - toolkit-network
    command: npm run docs:dev -- --host 0.0.0.0

  # ===========================================================================
  # Observability Stack
  # ===========================================================================

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: toolkit-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    networks:
      - toolkit-network
    restart: unless-stopped

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: toolkit-grafana
    ports:
      - "9999:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    networks:
      - toolkit-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Jaeger - Distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: toolkit-jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"  # UI
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - toolkit-network
    restart: unless-stopped

  # Loki - Log aggregation
  loki:
    image: grafana/loki:latest
    container_name: toolkit-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - toolkit-network
    restart: unless-stopped

  # Promtail - Log shipper
  promtail:
    image: grafana/promtail:latest
    container_name: toolkit-promtail
    volumes:
      - /var/log:/var/log
      - ./observability/promtail/config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - toolkit-network
    depends_on:
      - loki
    restart: unless-stopped
