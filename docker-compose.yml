      context: .
      dockerfile: Dockerfile
      target: development
    container_name: toolkit-app14
    working_dir: /app/examples/14_recommendation_engine
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8014 --reload
    ports:
      - "8014:8014"
    environment:
      DATABASE_URL: postgresql://toolkit:toolkit_dev@postgres:5432/toolkit
      PYTHONPATH: /app:/app/examples/14_recommendation_engine
