      - "8012:8012"
    environment:
      KAFKA_BROKERS: kafka:9092
      PYTHONPATH: /app:/app/examples/12_lambda_architecture
    depends_on:
      - kafka
      - postgres
    volumes:
      - ./src:/app/src
      - ./examples:/app/examples
