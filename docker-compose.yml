    ports:
      - "8008:8008"
    environment:
      TIMESCALE_URL: postgresql://toolkit:toolkit_dev@timescale:5432/timeseries
      PYTHONPATH: /app:/app/examples/08_timeseries_db
    depends_on:
      - timescale
    volumes:
      - ./src:/app/src
      - ./examples:/app/examples
