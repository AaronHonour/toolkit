[pytest]
# Pytest configuration for unistax security tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Coverage (if pytest-cov is installed)
# --cov=src/unistax
# --cov-report=html
# --cov-report=term-missing

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security-focused tests
    jwt: JWT-related tests
    csrf: CSRF-related tests
    ratelimit: Rate limiting tests
    secrets: Secrets management tests
    slow: Slow running tests

# Minimum Python version
minversion = 3.10
